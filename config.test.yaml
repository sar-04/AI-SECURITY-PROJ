llm:
  provider: mock
  fallback_provider: mock
  strict_primary: false
  anthropic:
    model: claude-3-5-sonnet-latest
    api_base: https://api.anthropic.com/v1/messages
    api_version: 2023-06-01
    max_tokens: 500
    timeout_s: 30

retrieval:
  backend: lexical
  top_k: 4

logging:
  path: logs/test_run.jsonl
  audit_path: logs/test_audit.jsonl
  gateway_path: logs/test_gateway.jsonl

mcp:
  gateway_audience: mcp-gateway
  server_audience: mcp-server
  issuer_url: http://securelab.local/auth
  resource_server_url: http://securelab.local/mcp
  rate_limit_per_minute: 100
  kill_switch: false
  shared_secret: secure-lab-test-secret-1234567890

security:
  firewall:
    enabled: true
    fail_closed: false
    mode: llm_hybrid
