llm:
  provider: anthropic
  fallback_provider: mock
  anthropic:
    model: claude-3-5-sonnet-latest
    api_base: https://api.anthropic.com/v1/messages
    api_version: 2023-06-01
    max_tokens: 500
    timeout_s: 30
  groq:
    model: llama-3.1-8b-instant
    temperature: 0.0
    max_tokens: 400

retrieval:
  backend: lexical
  top_k: 4

logging:
  path: logs/run.jsonl
  audit_path: logs/audit.jsonl
  gateway_path: logs/gateway.jsonl

mcp:
  gateway_audience: mcp-gateway
  server_audience: mcp-server
  issuer_url: http://securelab.local/auth
  resource_server_url: http://securelab.local/mcp
  rate_limit_per_minute: 30
  kill_switch: false
  shared_secret: secure-lab-demo-secret-change-me-1234567890
