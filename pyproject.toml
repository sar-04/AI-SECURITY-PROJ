[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-knowledge-ops-complete"
version = "0.1.0"
description = "Secure Anthropic-compatible lab knowledge agent showcase"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

